services:
  postgres:
    image: postgres:16-alpine
    container_name: ikonex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ikonex_sms
      POSTGRES_USER: ikonex_user
      POSTGRES_PASSWORD: ikonex_pass_2024
    ports:
      - "15432:5432"
    volumes:
      - ikonex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikonex_user -d ikonex_sms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ikonex_postgres_data:
